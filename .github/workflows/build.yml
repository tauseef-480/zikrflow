name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Add missing platform folders
        run: flutter create --platforms=android .
      - name: Show generated Android gradle files (debug)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              cat "$f"
            fi
          done
      - name: Force compileSdk to 36
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              if [[ "$f" == *.kts ]]; then
                sed -i -E "/flutter\.compileSdkVersion/s/.*/    compileSdk = 36/" "$f"
              else
                sed -i -E "/flutter\.compileSdkVersion/s/.*/    compileSdk 36/" "$f"
              fi
              echo "----- $f after patch -----"
              grep -n "compileSdk" "$f" || echo "NO compileSdk LINE FOUND"
            fi
          done
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dropload-apk
          path: build/app/outputs/flutter-apk/app-release.apk
